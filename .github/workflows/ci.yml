name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  secret-hygiene-and-collector:
    name: Secret Hygiene & Collector Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run Collector & Repo Secret Hygiene Test Suite
        run: |
          PYTHONDONTWRITEBYTECODE=1 python3 -m unittest discover -s collector/tests -v

  android-build-and-test:
    name: Android Unit Tests & Debug APK Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Run Android Unit Tests & Assemble Debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ai-quota-monitor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
